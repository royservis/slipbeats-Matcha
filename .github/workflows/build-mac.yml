name: Build Slipbeats.app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # needed to create the GitHub Release the app updates from

jobs:
  build:
    runs-on: macos-14          # Apple silicon runner → arm64 build for the Mac mini
    steps:
      - uses: actions/checkout@v4

      - name: Read version from slipbeats/__init__.py
        id: ver
        run: |
          V=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' slipbeats/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$V already exists — building only."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "New version v$V — will create a release."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip mutagen rapidfuzz pywebview pyinstaller pillow certifi

      - name: Make icon
        run: |
          mkdir -p assets/Slipbeats.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out assets/Slipbeats.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon.png --out assets/Slipbeats.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns assets/Slipbeats.iconset -o assets/Slipbeats.icns

      - name: Build
        run: python -m PyInstaller --noconfirm --clean Slipbeats.spec

      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - dist/Slipbeats.app
          cd dist && ditto -c -k --keepParent Slipbeats.app Slipbeats-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Slipbeats-mac-arm64
          path: dist/Slipbeats-mac-arm64.zip

      - name: Create release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" dist/Slipbeats-mac-arm64.zip \
            --title "Slipbeats v${{ steps.ver.outputs.version }}" \
            --notes "$(git log -1 --pretty=%B)"
